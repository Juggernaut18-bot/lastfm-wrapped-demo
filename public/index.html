<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f4f4">
<title>JUGGERNAUT — Last.fm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --silver:#eef0f1;
  --silver-2:#d9dde0;
  --silver-3:#f9faf9;
  --ink:#111416;
  --muted:#60676c;
  --orange:#ff6800;
  --orange-2:#ff8a00;
  --orange-3:#ffb52e;
  --orange-soft:rgba(255,104,0,.12);
  --orange-line:rgba(255,104,0,.34);
  --dark:#1a1d20;
  --white:#fff;
  --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink);background:var(--silver)}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.26;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 4px);
  mix-blend-mode:soft-light;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.shell{position:relative;min-height:100vh}
.topbar{
  position:fixed;z-index:100;top:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:5px;
  background:rgba(249,250,249,.82);backdrop-filter:blur(18px);
  border:1px solid rgba(17,20,22,.12);border-radius:999px;
  box-shadow:0 12px 35px rgba(25,28,30,.14);
}
.brand{
  display:none;
  font-size:11px;font-weight:700;letter-spacing:.16em;padding:8px 12px;
}
.tabs{display:flex;gap:2px;position:relative}
.tabs button{
  border:0;background:transparent;padding:9px 17px;border-radius:999px;
  font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);position:relative;z-index:2;
}
.tabs button.active{color:var(--ink)}
.tab-glow{
  position:absolute;z-index:1;top:4px;bottom:4px;left:4px;width:61px;border-radius:999px;
  background:var(--orange);box-shadow:0 5px 18px rgba(255,104,0,.28);
  transition:transform .32s cubic-bezier(.2,.9,.2,1),width .32s cubic-bezier(.2,.9,.2,1);
}
.tabs{max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto}

.concerts-page{min-height:100dvh;padding:105px 0 80px}
.concerts-wrap{width:min(1080px,calc(100% - 44px));margin:0 auto}
.concerts-hero{
  display:grid;grid-template-columns:1.35fr .65fr;gap:34px;align-items:end;
  padding:65px 0 55px;border-bottom:1px solid rgba(17,20,22,.12)
}
.concerts-kicker{font:800 10px var(--mono);letter-spacing:.16em;color:var(--muted);margin-bottom:18px}
.concerts-title{font-size:clamp(72px,11vw,150px);line-height:.78;letter-spacing:-.09em;margin:0}
.concerts-title .orange{color:var(--orange)}
.concerts-copy{font-size:18px;line-height:1.4;color:var(--muted);max-width:570px;margin:25px 0 0}
.concerts-count{
  min-height:190px;padding:28px;border-radius:28px;background:var(--dark);color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden
}
.concerts-count::after{
  content:"";position:absolute;width:170px;height:170px;border-radius:50%;
  right:-55px;bottom:-75px;background:var(--orange);opacity:.95
}
.concerts-count span{font:800 9px var(--mono);letter-spacing:.14em;color:#aeb4b8;position:relative;z-index:1}
.concerts-count strong{font:800 clamp(58px,8vw,92px)/.85 var(--mono);letter-spacing:-.08em;position:relative;z-index:1}
.concerts-count small{font:700 9px var(--mono);letter-spacing:.1em;color:#aeb4b8;position:relative;z-index:1}
.concerts-empty{
  margin-top:38px;min-height:390px;border:1px dashed rgba(17,20,22,.24);
  border-radius:30px;background:rgba(255,255,255,.48);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:50px;position:relative;overflow:hidden
}
.concerts-empty::before{
  content:"";position:absolute;inset:18px;border:1px solid rgba(17,20,22,.06);
  border-radius:22px;pointer-events:none
}
.concerts-empty-label{font:800 9px var(--mono);letter-spacing:.18em;color:var(--orange);margin-bottom:18px}
.concerts-empty h2{font-size:clamp(35px,6vw,68px);line-height:.88;letter-spacing:-.07em;margin:0 0 18px}
.concerts-empty p{max-width:520px;color:var(--muted);font-size:14px;line-height:1.55;margin:0}
.concerts-rule{
  width:72px;height:3px;background:var(--orange);border-radius:999px;margin:25px 0 18px
}
@media(max-width:760px){
  .concerts-page{padding-top:88px}
  .concerts-wrap{width:min(100% - 28px,1080px)}
  .concerts-hero{grid-template-columns:1fr;padding:48px 0 35px;gap:25px}
  .concerts-title{font-size:21vw}
  .concerts-copy{font-size:16px;margin-top:20px}
  .concerts-count{min-height:145px;border-radius:22px}
  .concerts-empty{min-height:330px;padding:36px 24px;border-radius:24px}
}
.period{display:none}
.period.active{display:block}
.day-mode{overflow:hidden;height:100dvh}
.day-mode .period.active{height:100dvh}
.loading-story{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:100px 22px 40px;
}
.loading-card{
  width:min(620px,100%);min-height:430px;border-radius:32px;
  background:linear-gradient(145deg,#fbfcfb,#dfe3e5);
  border:1px solid rgba(17,20,22,.13);
  box-shadow:0 30px 80px rgba(30,34,37,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px;
}
.loading-ring{
  width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(17,20,22,.12);border-top-color:var(--orange);
  animation:loadingSpin .8s linear infinite;margin-bottom:28px;
}
@keyframes loadingSpin{to{transform:rotate(360deg)}}
.loading-card::after{
  content:"";
  display:block;
  width:120px;height:2px;margin-top:28px;border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--orange),transparent);
  animation:loadingSweep 1.6s ease-in-out infinite;
}
@keyframes loadingSweep{
  0%{transform:translateX(-45px);opacity:.2}
  50%{transform:translateX(45px);opacity:1}
  100%{transform:translateX(-45px);opacity:.2}
}
.loading-card .loading-note{transition:opacity .2s ease}

.loading-kicker{font:800 10px var(--mono);letter-spacing:.16em;color:var(--muted);margin-bottom:14px}
.loading-card h1{font-size:clamp(34px,7vw,58px);line-height:.9;letter-spacing:-.055em;margin:0 0 14px}
.loading-card p{font:600 13px/1.5 var(--mono);color:var(--muted);max-width:430px;margin:0}
.loading-note{
  margin-top:26px;padding:8px 13px;border-radius:999px;
  background:var(--orange-soft);color:var(--orange);
  font:800 9px var(--mono);letter-spacing:.08em;
}
.story{
  min-height:100dvh;padding:92px 22px 28px;position:relative;display:flex;align-items:center;justify-content:center;
}
.story::before{
  content:"";position:absolute;width:48vw;height:48vw;max-width:650px;max-height:650px;
  right:-16vw;top:-14vw;background:var(--orange);border-radius:50%;
  filter:blur(2px);opacity:.10;pointer-events:none;
}
.day-story{height:100dvh;min-height:0;padding:78px 18px 18px}
.story-card{
  width:min(620px,100%);height:min(88dvh,860px);min-height:560px;
  border-radius:34px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#fbfcfb,#dfe3e5);
  border:1px solid rgba(17,20,22,.13);
  box-shadow:0 30px 80px rgba(30,34,37,.18);
}
.story-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 0 42%,rgba(255,255,255,.42) 48%,transparent 54%);
  opacity:.25;mix-blend-mode:screen;
}
.day-hero{
  position:absolute;inset:0;padding:34px;display:flex;flex-direction:column;justify-content:space-between;
}
.day-kicker{font:700 10px var(--mono);letter-spacing:.14em;color:var(--muted)}
.day-title{font-size:clamp(56px,11vw,92px);line-height:.82;letter-spacing:-.075em;margin:0;-webkit-text-stroke:2.8px #fff;paint-order:stroke fill;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.day-title .orange{color:var(--orange)}
.day-range{font:600 11px var(--mono);color:var(--muted);margin-top:14px}
.day-art{
  position:absolute;right:8%;top:18%;width:58%;aspect-ratio:1;border-radius:26px;overflow:hidden;
  transform:rotate(3deg);border:8px solid rgba(255,255,255,.68);
  box-shadow:0 25px 45px rgba(20,24,27,.24);
}
.day-art img{width:100%;height:100%;object-fit:cover;display:block}
.day-art::after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,transparent 40%,rgba(255,104,0,.25))}
.day-bottom{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
.day-stats{display:flex;gap:10px;flex-wrap:wrap}
.pill{
  display:flex;flex-direction:column;padding:12px 14px;border-radius:15px;
  background:rgba(255,255,255,.72);border:1px solid rgba(17,20,22,.10);
  backdrop-filter:blur(8px);min-width:90px;
}
.pill b{font:700 23px var(--mono);letter-spacing:-.06em}
.pill span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.day-track{
  max-width:220px;background:var(--orange);color:#111;padding:15px 16px;border-radius:18px;
  box-shadow:0 12px 28px rgba(255,104,0,.28);transform:rotate(-2deg)
}
.day-track small{display:block;font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.day-track strong{display:block;font-size:17px;line-height:1.05;margin-top:5px}
.day-track span{display:block;font-size:11px;margin-top:5px;opacity:.72}
.scroll-page{padding-top:104px}
.page-wrap{width:min(1120px,100%);margin:auto}
.page-hero{
  min-height:74dvh;display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;
  padding:40px 0 80px;
}
.page-kicker{font:700 11px var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.page-title{font-size:clamp(68px,10vw,145px);line-height:.78;letter-spacing:-.085em;margin:18px 0 25px}
.page-title .orange{color:var(--orange)}
.page-copy{font-size:18px;line-height:1.35;color:var(--muted);max-width:500px}
.big-number{
  display:inline-flex;align-items:baseline;gap:8px;margin-top:26px;
  font:700 clamp(42px,7vw,78px) var(--mono);letter-spacing:-.07em
}
.big-number small{font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted)}
.hero-art{
  width:min(470px,100%);justify-self:end;aspect-ratio:1;border-radius:34px;overflow:hidden;
  border:10px solid rgba(255,255,255,.72);box-shadow:0 30px 70px rgba(25,28,30,.20);
  transform:rotate(2.5deg)
}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.section{padding:70px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
.section-head h2{margin:0;font-size:clamp(38px,6vw,72px);line-height:.86;letter-spacing:-.07em}
.section-head p{margin:0;color:var(--muted);max-width:330px;font-size:13px;line-height:1.4}
.fun-list{border-top:2px solid var(--ink)}
.fun-row{
  display:grid;grid-template-columns:52px 62px 1fr auto;align-items:center;gap:15px;
  padding:15px 6px;border-bottom:1px solid rgba(17,20,22,.13);transition:.2s
}
.fun-row:hover{background:rgba(255,104,0,.08);padding-left:14px;padding-right:14px}
.fun-rank{font:700 12px var(--mono);color:var(--muted)}
.fun-art{width:62px;height:62px;border-radius:12px;overflow:hidden;background:var(--silver-2)}
.fun-art img{width:100%;height:100%;object-fit:cover}
.fun-title{font-size:18px;font-weight:700;line-height:1.05}
.fun-sub{font-size:12px;color:var(--muted);margin-top:5px}
.fun-count{font:600 12px var(--mono);color:var(--muted)}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{
  padding:22px;border-radius:22px;background:#f8f9f9;border:1px solid rgba(17,20,22,.11);
  box-shadow:0 12px 28px rgba(30,34,37,.08);position:relative;overflow:hidden
}
.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--orange)}
.stat-card b{display:block;font:700 34px var(--mono);letter-spacing:-.07em}
.stat-card span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card{padding:22px;border-radius:24px;background:var(--dark);color:white}
.chart-card h3{margin:0 0 18px;font-size:14px}
.bars{height:220px;display:flex;align-items:end;gap:5px}
.bar-wrap{height:100%;flex:1;display:flex;align-items:end}
.bar{width:100%;min-height:3px;background:linear-gradient(to top,var(--orange),var(--orange-3));border-radius:5px 5px 2px 2px}
.labels{display:flex;gap:5px;margin-top:9px}
.labels span{flex:1;text-align:center;font:9px var(--mono);color:#aeb4b8}
.sticker{
  display:inline-block;background:var(--orange);color:#111;font:800 10px var(--mono);
  padding:8px 11px;border-radius:9px;transform:rotate(-2deg);letter-spacing:.08em
}
.footer{padding:45px 0 70px;display:flex;justify-content:space-between;color:var(--muted);font:10px var(--mono)}

/* =========================================================
   STORY CHAPTERS — same visual language as the Day card
   ========================================================= */
.story-page{padding-bottom:40px}
.story-intro{
  min-height:88dvh;display:grid;grid-template-columns:1fr .9fr;gap:34px;
  align-items:center;padding:82px 0 75px;position:relative;
}
.story-intro::before{
  content:"";position:absolute;left:-18vw;top:4%;width:45vw;height:45vw;max-width:620px;max-height:620px;
  border-radius:50%;background:var(--orange);opacity:.075;filter:blur(2px);pointer-events:none
}
.intro-copy{position:relative;z-index:2}
.intro-copy .page-kicker{margin-top:22px}
.intro-meta{font:600 11px var(--mono);color:var(--muted);margin-top:14px}
.story-big{
  display:inline-flex;align-items:baseline;gap:8px;margin-top:25px;
  font:700 clamp(44px,7vw,82px) var(--mono);letter-spacing:-.075em
}
.story-big small{font:600 10px var(--mono);letter-spacing:.10em;color:var(--muted)}
.sticker-gold{background:var(--orange-3)}
.sticker-deep{background:var(--dark);color:#fff}
.hero-art.tilt-left{transform:rotate(-3.5deg)}
.hero-art.tilt-right{transform:rotate(4deg)}
.story-spread{padding:70px 0 85px}
.story-spread>p{color:var(--muted);font-size:15px;max-width:480px;margin:8px 0 25px}
.spread-label{
  display:flex;align-items:center;gap:12px;font:700 10px var(--mono);letter-spacing:.13em;
  color:var(--muted);margin-bottom:18px
}
.spread-label span{
  display:grid;place-items:center;width:28px;height:28px;border-radius:8px;
  background:var(--orange);color:#111;letter-spacing:0
}
.story-panel{
  padding:25px;border-radius:30px;background:#f8f9f9;border:1px solid rgba(17,20,22,.12);
  box-shadow:0 24px 60px rgba(25,28,30,.12);position:relative;overflow:hidden
}
.story-panel::after{
  content:"";position:absolute;inset:auto -10% -45% 45%;height:70%;
  background:var(--orange);opacity:.055;border-radius:50%;pointer-events:none
}
.story-panel.accent-dark{background:var(--dark);color:#fff;border-color:transparent}
.story-panel.accent-silver{background:linear-gradient(145deg,#fbfcfc,#dce0e2)}
.story-panel-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}
.story-panel-head span{font:700 9px var(--mono);letter-spacing:.13em;color:var(--orange)}
.story-panel-head h2{margin:0;font-size:clamp(30px,5vw,52px);letter-spacing:-.07em;line-height:.9}
.story-list{border-top:2px solid currentColor}
.story-row{
  display:grid;grid-template-columns:34px 58px 1fr auto;align-items:center;gap:13px;
  padding:12px 4px;border-bottom:1px solid rgba(17,20,22,.13);min-height:82px
}
.accent-dark .story-row{border-bottom-color:rgba(255,255,255,.12)}
.story-rank{font:700 11px var(--mono);color:var(--muted)}
.accent-dark .story-rank{color:#969da2}
.story-thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--silver-2)}
.story-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.story-copy{min-width:0}
.story-copy strong{display:block;font-size:16px;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-copy small{display:block;margin-top:5px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accent-dark .story-copy small{color:#aab0b4}
.story-plays{font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
.accent-dark .story-plays{color:#aab0b4}
.spread-orange{background:linear-gradient(180deg,transparent,#fff2e8)}
.spread-gold{background:linear-gradient(180deg,transparent,#fff7e8)}
.spread-deep{background:linear-gradient(180deg,transparent,#eef0f1)}
.spread-dark{
  margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding-left:calc(50vw - 50%);padding-right:calc(50vw - 50%);
  background:#171a1d;color:#fff
}
.spread-dark>p{color:#aeb4b8}
.lifetime-screen-stats{
  padding:72px 0 45px;
}
.lifetime-screen-stats>p{
  color:var(--muted);font-size:15px;max-width:480px;margin:8px 0 25px
}
.lifetime-screen-grid{
  display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;
  border-top:2px solid rgba(17,20,22,.14);
  border-bottom:1px solid rgba(17,20,22,.10);
  background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(230,233,234,.68));
  border-radius:24px;overflow:hidden;
}
.lifetime-screen-stat{
  min-height:190px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;
}
.lifetime-screen-stat+.lifetime-screen-stat{
  border-left:1px solid rgba(17,20,22,.10)
}
.lifetime-screen-stat span{
  font:800 10px var(--mono);letter-spacing:.12em;color:var(--muted);margin-bottom:12px
}
.lifetime-screen-stat strong{
  font:800 clamp(25px,4vw,52px)/.95 var(--mono);
  letter-spacing:-.055em;color:#111416;white-space:nowrap
}
.lifetime-screen-stat small{
  margin-top:9px;font:600 8px/1.35 var(--mono);letter-spacing:.08em;color:#92999e
}
.lifetime-screen-stat.lifetime-time{
  background:var(--orange);color:#111416
}
.lifetime-screen-stat.lifetime-time span,
.lifetime-screen-stat.lifetime-time small{color:rgba(17,20,22,.68)}
@media(max-width:850px){
  .lifetime-screen-grid{grid-template-columns:1fr 1fr}
  .lifetime-screen-stat:nth-child(3){border-left:0;border-top:1px solid rgba(17,20,22,.10)}
  .lifetime-screen-stat:nth-child(4){border-top:1px solid rgba(17,20,22,.10)}
}

.lifetime-perspective{
  padding:20px 0 50px;
}
.lifetime-perspective>p{
  color:var(--muted);font-size:15px;max-width:560px;margin:8px 0 25px
}
.lifetime-perspective-grid{
  display:grid;grid-template-columns:1.35fr 1fr 1fr;
  gap:12px;
}
.perspective-card{
  min-height:185px;padding:28px 26px;border-radius:22px;
  background:#fff;border:1px solid rgba(17,20,22,.10);
  box-shadow:0 16px 35px rgba(25,28,30,.06);
  display:flex;flex-direction:column;justify-content:space-between;
}
.perspective-card span{
  font:800 9px var(--mono);letter-spacing:.13em;color:var(--muted)
}
.perspective-card strong{
  font:800 clamp(36px,5vw,64px)/.9 var(--mono);letter-spacing:-.07em;color:#111416
}
.perspective-card small{
  font:600 9px/1.35 var(--mono);letter-spacing:.08em;color:#92999e;max-width:240px
}
.perspective-card.perspective-feature{
  background:var(--dark);color:#fff;border-color:var(--dark)
}
.perspective-card.perspective-feature span{color:#aeb4b8}
.perspective-card.perspective-feature strong{color:#fff}
.perspective-card.perspective-feature small{color:#8f989d}
@media(max-width:850px){

<body class="day-mode">
<button class="share-fab" id="shareFab" type="button">↗ SHARE STORY</button>
<div class="shell">
<header class="topbar">
  <div class="brand">JUGGERNAUT</div>
  <nav class="tabs" id="tabs" aria-label="Time period">
    <span class="tab-glow" id="tabGlow"></span>
    <button data-period="day" class="active" aria-selected="true">Day</button>
    <button data-period="week" aria-selected="false">Week</button>
    <button data-period="month" aria-selected="false">Month</button>
    <button data-period="year" aria-selected="false">Year</button>
    <button data-period="lifetime" aria-selected="false">Lifetime</button>
    <button data-period="concerts" aria-selected="false">Concerts</button>
  </nav>
</header>

<section id="day" class="period active"></section>
<section id="week" class="period"></section>
<section id="month" class="period"></section>
<section id="year" class="period"></section>
<section id="lifetime" class="period"></section>
<section id="concerts" class="period"></section>
</div>

<script>
const API="";
const state={
  period:"day",
  cache:{},
  requests:{}
};

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

function loadingView(period){
  const labels={
    day:"LOADING TODAY…",
    week:"LOADING THIS WEEK…",
    month:"LOADING THIS MONTH…",
    year:"BUILDING YOUR YEAR…",
    lifetime:"BUILDING YOUR LIFETIME…"
  };
  const messages={
    day:"Fetching the last 24 hours.",
    week:"Fetching this week’s charts and listening history.",
    month:"Fetching this month’s charts and listening history.",
    year:"Building your year summary.",
    lifetime:"Loading your all-time listening history."
  };
  return `<main class="story loading-story">
    <div class="loading-card">
      
      <div class="loading-kicker">LAST.FM / ${String(period).toUpperCase()}</div>
      <h1>${labels[period]||"LOADING…"}</h1>
      <p>${messages[period]||"Fetching your listening data."}</p>
      
    </div>
  </main>`;
}


function num(v){return v==null?"—":Number(v).toLocaleString()}
function heading(p){return({day:"TODAY",week:"THIS WEEK",month:"THIS MONTH",year:"YOUR YEAR",lifetime:"LIFETIME"})[p]||""}
function range(d){return d.period==="lifetime"?"ALL TIME":(d.period_label||"")}
function img(url,alt="",cls=""){return url?`<img class="${cls}" src="${esc(url)}" alt="${esc(alt)}" decoding="async" onerror="this.style.display=\'none\'">`:""}

async function getJson(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function getStats(period){
  if(state.cache[period])return state.cache[period];
  if(state.requests[period])return state.requests[period];

  const promise=(async()=>{
    const now=Math.floor(Date.now()/1000);
    const periodMap={week:"7day",month:"1month"};

    if(period==="lifetime"){
      const d=await getLifetimeStats();
      state.cache[period]=d;
      return d;
    }

    if(period==="day"){
      const d=await buildHistoryPeriod(now-86400,now);
      d.period="day";
      d.period_label="LAST 24 HOURS";
      state.cache[period]=d;
      return d;
    }

    if(period==="year"){
      /* Use the Worker's dedicated year aggregation endpoint.
         It already handles the full 18 May 2025 → 18 May 2026 scan,
         batching and server-side caching, instead of making the browser
         fan out dozens of /history requests itself. */
      const d=await getJson(`${API}/stats?period=year`);
      d.period="year";
      d.period_label="LAST 12 MONTHS";
      d.top_artists=(d.top_artists||[]).slice(0,5);
      d.top_albums=(d.top_albums||[]).slice(0,5);
      d.top_tracks=(d.top_tracks||[]).slice(0,5);
      state.cache[period]=d;
      return d;
    }

    const lfPeriod=periodMap[period];
    if(!lfPeriod)throw new Error(`Unsupported period: ${period}`);

    /* Native Last.fm rankings render first. */
    const [artists,albums,tracks]=await Promise.all([
      getJson(`${API}/top-artists?period=${lfPeriod}&limit=10`),
      getJson(`${API}/top-albums?period=${lfPeriod}&limit=10`),
      getJson(`${API}/top-tracks?period=${lfPeriod}&limit=10`)
    ]);

    const d={
      period,
      period_label:period==="week"?"LAST 7 DAYS":"LAST 30 DAYS",
      top_artists:pickList(artists,"artists").slice(0,5),
      top_albums:pickList(albums,"albums").slice(0,5),
      top_tracks:pickList(tracks,"tracks").slice(0,5),
      total_scrobbles:null,
      analyzed_scrobbles:null,
      unique_artists:null,
      unique_albums:null,
      unique_tracks:null,
      _historyPending:true
    };
    state.cache[period]=d;

    /* The slower history calculation runs in the background. */
    const historySeconds=period==="week"?7*86400:30*86400;
    buildHistoryPeriod(now-historySeconds,now).then(history=>{
      const current=state.cache[period];
      if(!current)return;
      Object.assign(current,history,{_historyPending:false});
      if(state.period===period)render(period,current);
    }).catch(()=>{
      const current=state.cache[period];
      if(current)current._historyPending=false;
    });

    return d;
  })();

  state.requests[period]=promise;
  try{return await promise}
  finally{delete state.requests[period]}
}

function pickList(v,key){
  if(Array.isArray(v))return v;
  if(Array.isArray(v?.[key]))return v[key];
  if(Array.isArray(v?.items))return v.items;
  return [];
}

async function buildHistoryPeriod(from,to){
  const first=await getJson(`${API}/history?from=${from}&to=${to}&page=1&limit=200`);
  const firstTracks=Array.isArray(first?.tracks)?first.tracks:[];
  const totalPages=Math.max(1,Number(first?.total_pages||1));
  const pages=[firstTracks];

  if(totalPages>1){
    const pageNumbers=[];
    for(let p=2;p<=totalPages;p++)pageNumbers.push(p);
    for(let i=0;i<pageNumbers.length;i+=8){
      const batch=pageNumbers.slice(i,i+8);
      const results=await Promise.all(batch.map(p=>getJson(`${API}/history?from=${from}&to=${to}&page=${p}&limit=200`)));
      for(const r of results)pages.push(Array.isArray(r?.tracks)?r.tracks:[]);
    }
  }

  const tracks=pages.flat().filter(x=>!x?.now_playing);
  const artists=new Set(),albums=new Set(),uniqueTracks=new Set();
  for(const x of tracks){
    const artist=String(x?.artist||"").trim();
    const album=String(x?.album||"").trim();
    const track=String(x?.track||"").trim();
    if(artist)artists.add(artist.toLowerCase());
    if(album)albums.add(`${artist.toLowerCase()}\u0000${album.toLowerCase()}`);
    if(track)uniqueTracks.add(`${artist.toLowerCase()}\u0000${track.toLowerCase()}`);
  }

  return {
    total_scrobbles:tracks.length,
    analyzed_scrobbles:tracks.length,
    unique_artists:artists.size,
    unique_albums:albums.size,
    unique_tracks:uniqueTracks.size,
    top_artists:aggregateTop(tracks),
    top_albums:aggregateTopAlbums(tracks),
    top_tracks:aggregateTopTracks(tracks)
  };
}

function aggregateTop(tracks){
  const m=new Map();
  for(const x of tracks){
    const name=String(x?.artist||"").trim();
    if(!name)continue;
    const k=name.toLowerCase();
    const row=m.get(k)||{artist:name,playcount:0,image:x?.image||""};
    row.playcount++;
    if(!row.image&&x?.image)row.image=x.image;
    m.set(k,row);
  }
  return [...m.values()].sort((a,b)=>b.playcount-a.playcount||a.artist.localeCompare(b.artist));
}

function aggregateTopTracks(tracks){
  const m=new Map();
  for(const x of tracks){
    const artist=String(x?.artist||"").trim(),track=String(x?.track||"").trim();
    if(!track)continue;
    const k=`${artist.toLowerCase()}\u0000${track.toLowerCase()}`;
    const row=m.get(k)||{artist,track,album:String(x?.album||""),playcount:0,image:x?.image||""};
    row.playcount++;
    if(!row.image&&x?.image)row.image=x.image;
    m.set(k,row);
  }
  return [...m.values()].sort((a,b)=>b.playcount-a.playcount||a.track.localeCompare(b.track));
}

function aggregateTopAlbums(tracks){
  const m=new Map();
  for(const x of tracks){
    const artist=String(x?.artist||"").trim(),album=String(x?.album||"").trim();
    if(!album)continue;
    const k=`${artist.toLowerCase()}\u0000${album.toLowerCase()}`;
    const row=m.get(k)||{artist,album,playcount:0,image:x?.image||""};
    row.playcount++;
    if(!row.image&&x?.image)row.image=x.image;
    m.set(k,row);
  }
  return [...m.values()].sort((a,b)=>b.playcount-a.playcount||a.album.localeCompare(b.album));
}

async function getLifetimeStats(){
  if(state.cache.lifetime)return state.cache.lifetime;
  if(state.requests.lifetime)return state.requests.lifetime;

  const promise=(async()=>{
    const [artists,albums,tracks,info]=await Promise.all([
      getJson(`${API}/top-artists?period=overall&limit=10`),
      getJson(`${API}/top-albums?period=overall&limit=10`),
      getJson(`${API}/top-tracks?period=overall&limit=10`),
      getJson(`${API}/info`)
    ]);

    const lifetimeScrobbles=Number(info?.user?.playcount ?? info?.playcount ?? 0);
    const d={
      period:"lifetime",
      period_label:"ALL TIME",
      top_artists:pickList(artists,"artists").slice(0,10),
      top_albums:pickList(albums,"albums").slice(0,10),
      top_tracks:pickList(tracks,"tracks").slice(0,10),
      analyzed_scrobbles:lifetimeScrobbles,
      total_scrobbles:lifetimeScrobbles,
      unique_artists:null,
      unique_albums:null,
      unique_tracks:null,
      total_listening_minutes:lifetimeScrobbles*4,
      total_listening_estimated:true,
      _historyPending:true
    };
    state.cache.lifetime=d;

    /*
      Lifetime totals come from the Worker's server-side stats aggregation.
      This is deliberately not exposed as a "background" detail in the UI.
      The browser only sees a clean loading state until the four numbers are
      ready.
    */
    const lifetimeFrom=1;
    const lifetimeTo=Math.floor(Date.now()/1000);

    const historyPromise=(async()=>{
      let lastError=null;

      /* First choice: one server-side aggregation request. */
      for(let attempt=0;attempt<2;attempt++){
        try{
          const stats=await getJson(`${API}/stats?from=${lifetimeFrom}&to=${lifetimeTo}`);
          if(
            stats &&
            Number.isFinite(Number(stats.unique_artists)) &&
            Number.isFinite(Number(stats.unique_tracks))
          ){
            return {
              unique_artists:Number(stats.unique_artists),
              unique_albums:Number(stats.unique_albums||0),
              unique_tracks:Number(stats.unique_tracks)
            };
          }
          lastError=new Error("Lifetime stats response was incomplete.");
        }catch(e){
          lastError=e;
        }
        if(attempt===0)await new Promise(r=>setTimeout(r,1200));
      }

      /* Fallback: direct history aggregation if the server stats endpoint
         is temporarily unavailable. */
      try{
        const history=await buildHistoryPeriod(lifetimeFrom,lifetimeTo);
        return {
          unique_artists:Number(history.unique_artists||0),
          unique_albums:Number(history.unique_albums||0),
          unique_tracks:Number(history.unique_tracks||0)
        };
      }catch(e){
        lastError=e;
      }

      throw lastError||new Error("Lifetime totals could not be calculated.");
    })();

    d._historyPromise=historyPromise;

    historyPromise.then(history=>{
      const current=state.cache.lifetime;
      if(!current)return;
      current.unique_artists=history.unique_artists;
      current.unique_albums=history.unique_albums;
      current.unique_tracks=history.unique_tracks;
      current._historyPending=false;
      current._historyError=false;
      if(state.period==="lifetime")render("lifetime",current);
    }).catch(()=>{
      const current=state.cache.lifetime;
      if(current){
        current._historyPending=false;
        current._historyError=true;
      }
      if(state.period==="lifetime")render("lifetime",current);
    });

    return d;
  })();

  state.requests.lifetime=promise;
  try{return await promise}
  finally{delete state.requests.lifetime}
}

function dayView(d){
  const artist=d.top_artists?.[0], track=d.top_tracks?.[0];
  const art=artist?.image||track?.image;
  return `<main class="story day-story"><div class="story-card">
    ${art?`<div class="day-art">${img(art,artist?.artist||"Top artist")}</div>`:""}
    <div class="day-hero">
      <div><div class="day-kicker">JUGGERNAUT / LAST.FM</div></div>
      <div>
        <div class="sticker">YOUR DAY IN MUSIC</div>
        <h1 class="day-title">TODAY<br><span class="orange">IN MUSIC.</span></h1>
        <div class="day-range">${esc(range(d))}</div>
      </div>
      <div class="day-bottom">
        <div class="day-stats">
          <div class="pill"><b>${num(d.analyzed_scrobbles)}</b><span>scrobbles</span></div>
          <div class="pill"><b>${num(d.unique_artists)}</b><span>artists</span></div>
          <div class="pill"><b>${num(d.unique_tracks)}</b><span>tracks</span></div>
        </div>
        ${track?`<div class="day-track"><small>ON REPEAT</small><strong>${esc(track.track)}</strong><span>${esc(track.artist)} · ${num(track.playcount)} plays</span></div>`:""}
      </div>
    </div>
  </div></main>`;
}

function rows(items,primary,sub){
  if(!items?.length)return `<p style="color:var(--muted)">Nothing here yet.</p>`;
  return `<div class="fun-list">${items.map((x,i)=>`<div class="fun-row">
    <div class="fun-rank">${String(i+1).padStart(2,"0")}</div>
    <div class="fun-art">${x.image?img(x.image,`${x[primary]} artwork`):""}</div>
    <div><div class="fun-title">${esc(x[primary])}</div>${sub?`<div class="fun-sub">${esc(x[sub])}</div>`:""}</div>
    <div class="fun-count">${num(x.playcount)} plays</div>
  </div>`).join("")}</div>`;
}

function bars(vals){
  const max=Math.max(...vals,1);
  return vals.map(v=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(3,v/max*100)}%"></div></div>`).join("");
}

function storyRows(items, primary, sub, variant="light", limit=5){
  if(!items?.length) return `<div class="story-empty">Nothing here yet.</div>`;
  return `<div class="story-list ${variant}">${items.slice(0,limit).map((x,i)=>`
    <div class="story-row">
      <span class="story-rank">${String(i+1).padStart(2,"0")}</span>
      <span class="story-thumb">${x.image?img(x.image,`${x[primary]} artwork`):""}</span>
      <span class="story-copy">
        <strong>${esc(x[primary])}</strong>
        ${sub?`<small>${esc(x[sub])}</small>`:""}
      </span>
      <span class="story-plays">${num(x.playcount)}</span>
    </div>
  `).join("")}</div>`;
}

function storyPanel(title, kicker, items, primary, sub, accent="orange", limit=5){
  return `<section class="story-panel accent-${accent}">
    <div class="story-panel-head">
      <span>${kicker}</span><h2>${title}</h2>
    </div>
    ${storyRows(items,primary,sub,accent,limit)}
  </section>`;
}

function longView(d){
  const artist=d.top_artists?.[0], track=d.top_tracks?.[0], album=d.top_albums?.[0];
  const art=artist?.image||album?.image||track?.image;
  const p=d.period;
  const config={
    week:{
      tag:"THIS WEEK", title:"THIS WEEK", copy:"Seven days. Five songs. The artists and albums that owned the week.",
      color:"orange", note:"A small week with a lot of noise.", limit:5
    },
    month:{
      tag:"THIS MONTH", title:"THIS MONTH", copy:"A whole month of listening, reduced to the things you kept coming back to.",
      color:"gold", note:"One month. Five records. Zero filler.", limit:5
    },
    year:{
      tag:"YOUR YEAR", title:"YOUR YEAR", copy:"The last 12 months of listening. The soundtrack of your year.",
      color:"deep", note:"A year of listening, distilled.", limit:5
    },
    lifetime:{
      tag:"THE ARCHIVE", title:"YOUR SCROBBLING JOURNEY.", copy:"The complete Last.fm era captured in this archive — from the first recorded scrobble to everything that followed.",
      color:"orange", note:"Your listening history, all in one place.", limit:10
    }
  }[p];

  const artClass=p==="month"?"hero-art tilt-left":p==="year"?"hero-art tilt-right":"hero-art";
  return `<main class="scroll-page story-page ${p}-page">
    <div class="page-wrap">

      <section class="story-intro">
        <div class="intro-copy">
          <span class="sticker sticker-${config.color}">${config.tag}</span>
          <div class="page-kicker">JUGGERNAUT / LAST.FM</div>
          <h1 class="page-title">${d.period==="lifetime" ? config.title : `${config.title}<br><span class="orange">IN MUSIC.</span>`}</h1>
          <p class="page-copy">${config.copy}</p>
          <div class="intro-meta">${d.period==="lifetime"?"SINCE 14 APRIL 2025":esc(range(d))}</div>
          ${d.period!=="lifetime" ? `<div class="story-big">${
      d._historyPending?"LOADING…":num(d.analyzed_scrobbles)
    } <small>SCROBBLES</small></div>` : ""}
        </div>
        ${art?`<div class="${artClass}">${img(art,artist?.artist||album?.album||"Top artwork")}</div>`:""}
      </section>

      <section class="story-spread spread-${config.color}">
        <div class="spread-label"><span>01</span><b>THE ARTISTS</b></div>
        <p>${config.note}</p>
        ${storyPanel("The artists.",`TOP ${config.limit}`,d.top_artists,"artist",null,config.color,config.limit)}
      </section>

      <section class="story-spread spread-dark">
        <div class="spread-label"><span>02</span><b>THE SONGS</b></div>
        <p>These are the tracks that kept finding their way back into the queue.</p>
        ${storyPanel("On repeat.",`TOP ${config.limit}`,d.top_tracks,"track","artist","dark",config.limit)}
      </section>

      <section class="story-spread spread-light">
        <div class="spread-label"><span>03</span><b>THE ALBUMS</b></div>
        <p>${d.period==="lifetime"?"Ten records. Ten little worlds you spent time inside.":"Five records. Five little worlds you spent time inside."}</p>
        ${storyPanel("The records.",`TOP ${config.limit}`,d.top_albums,"album","artist","silver",config.limit)}
      </section>

      ${d.period==="lifetime"?`
      <section class="lifetime-screen-stats">
        <div class="spread-label"><span>04</span><b>THE NUMBERS</b></div>
        <p>A few numbers to put the archive in perspective.</p>
        <div class="lifetime-screen-grid">
          <div class="lifetime-screen-stat lifetime-time">
            <span>TOTAL TIME LISTENED</span>
            <strong>${listeningTime(d).value==="—"?"LOADING…":"≈ "+esc(listeningTime(d).value)}</strong>
            <small>ESTIMATED AT 4 MIN / SCROBBLE</small>
          </div>
          <div class="lifetime-screen-stat">
            <span>TOTAL SCROBBLES</span>
            <strong>${num(d.total_scrobbles)}</strong>
            <small>ALL TIME</small>
          </div>
          <div class="lifetime-screen-stat">
            <span>TOTAL SONGS</span>
            <strong>${d._historyPending?"LOADING…":(d._historyError?"UNAVAILABLE":num(d.unique_tracks))}</strong>
            <small>UNIQUE TRACKS</small>
          </div>
          <div class="lifetime-screen-stat">

function lifetimePerspective(d){
  const minutes=Number(d.total_listening_minutes ?? d.listening_minutes ?? d.total_minutes);
  if(!Number.isFinite(minutes) || minutes<=0){
    return `<div class="perspective-card perspective-feature"><span>CONTINUOUS PLAY</span><strong>LOADING…</strong><small>BASED ON YOUR ESTIMATED LISTENING TIME</small></div>`;
  }
  const totalDays=minutes/1440;
  const days=Math.floor(totalDays);
  const hours=Math.floor((minutes%1440)/60);
  const mins=Math.round(minutes%60);
  const months=totalDays/30.4375;
  const workdays=minutes/60/8;
  return `
    <div class="perspective-card perspective-feature">
      <span>IF THE MUSIC NEVER STOPPED</span>
      <strong>${days} DAYS</strong>

function listeningTime(d){
  const minutes=Number(d.total_listening_minutes ?? d.listening_minutes ?? d.total_minutes);
  if(Number.isFinite(minutes) && minutes>0){
    const h=Math.floor(minutes/60),m=Math.round(minutes%60);
    return {
      value:h?`${h}h ${String(m).padStart(2,"0")}m`:`${m}m`,
      exact:!d.total_listening_estimated
    };
  }
  return {value:"—",exact:false};
}

function recentItems(payload){
  if(Array.isArray(payload))return payload;
  for(const key of ["recent","scrobbles","tracks","items","data"]){
    if(Array.isArray(payload?.[key]))return payload[key];
  }
  return [];
}
function itemUnix(x){
  const raw=x?.uts ?? x?.timestamp ?? x?.date?.uts ?? x?.date?.unix;
  if(raw!=null){
    const n=Number(raw);
    if(Number.isFinite(n))return n>1e12?n/1000:n;
  }
  const date=x?.date?.iso ?? x?.date?.text ?? x?.date;
  const parsed=Date.parse(date||"");
  return Number.isFinite(parsed)?parsed/1000:null;
}
async function getDailyTrackSummary(d){
  try{
    const payload=await getJson(`${API}/recent?limit=200`);
    const items=recentItems(payload);
    const now=Date.now()/1000;
    const start=now-86400;
    const map=new Map();
    let exactMinutes=0;let hasDuration=false;
    for(const x of items){
      if(x?.nowplaying===true || x?.nowplaying==="true")continue;
      const t=itemUnix(x);
      if(t==null || t<start || t>now)continue;
      const track=String(x.track||x.name||x.title||"").trim();
      const artist=String(x.artist||x.artist_name||x.artistName||x.artist?.name||"").trim();
      if(!track)continue;
      const key=`${artist}\u0000${track}`;
      const durationRaw=x.duration ?? x.duration_seconds ?? x.track?.duration;
      const duration=Number(durationRaw);
      if(Number.isFinite(duration)&&duration>0){exactMinutes+=duration/60;hasDuration=true;}
      const row=map.get(key)||{track,artist,count:0,image:x.image||x.image_url||x.artwork||x.image?.[0]?.["#text"]||"",latest:t};
      row.count+=1; row.latest=Math.max(row.latest,t);
      if(!row.image)row.image=x.image||x.image_url||x.artwork||"";
      map.set(key,row);
    }
    const result=[...map.values()].sort((a,b)=>b.count-a.count||b.latest-a.latest);
    result.exactMinutes=hasDuration?exactMinutes:null;
    return result;
  }catch(_){return []}
}

async function waitForExportImages(host){
  const images=[...host.querySelectorAll("img")];
  await Promise.race([
    (document.fonts?.ready || Promise.resolve()).then(()=>Promise.all(images.map(image=>new Promise(resolve=>{
      image.crossOrigin="anonymous";
      if(image.complete && image.naturalWidth){
        if(image.decode){ image.decode().then(resolve).catch(resolve); }
        else resolve();
        return;
      }
      image.onload=()=>{ if(image.decode) image.decode().then(resolve).catch(resolve); else resolve(); };
      image.onerror=resolve;
    })))) ,
    new Promise(resolve=>setTimeout(resolve,3500))
  ]);
}

async function shareCurrentStory(){
  if(shareBusy)return;
  const btn=document.getElementById("shareFab");
  const d=state.cache[state.period];
  if(!d)return;
  shareBusy=true;btn.disabled=true;btn.textContent="MAKING STORY…";
  let host;
  try{
    if(d.period==="lifetime" && d._historyPending && d._historyPromise){
      btn.textContent="LOADING TOTALS…";
      try{ await d._historyPromise; }catch(_){}
    }
    await enrichMissingTrackArtwork(d);
    const dailyTracks=d.period==="day"?await getDailyTrackSummary(d):null;
    host=makeExportCard(d,dailyTracks);
    await waitForExportImages(host);

    if(d.period==="lifetime"){
      const cards=[...host.querySelectorAll(".export-card")];
      const blobs=[];
      for(const card of cards){
        const canvas=await captureExportCard(card);
        const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG creation failed")),"image/png",1));
        blobs.push(blob);
      }

      const files=blobs.map((blob,i)=>new File([blob],`lastfm-lifetime-story-${i+1}.png`,{type:"image/png"}));
      const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if(mobile && navigator.share && navigator.canShare && navigator.canShare({files})){
        await navigator.share({files,title:"Last.fm Lifetime Wrapped",text:"My all-time Last.fm Wrapped"});
      }else{
        for(const file of files){
          const url=URL.createObjectURL(file);
          const a=document.createElement("a");a.href=url;a.download=file.name;a.style.display="none";
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),1500);
          await new Promise(r=>setTimeout(r,350));
        }
      }
      return;
    }

    const canvas=await captureExportCard(host.firstElementChild);
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG creation failed")),"image/png",1));
    const file=new File([blob],`lastfm-${state.period}-story.png`,{type:"image/png"});
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(mobile && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`Last.fm ${heading(state.period)}`,text:"My Last.fm Wrapped"});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download=file.name;a.style.display="none";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
    }
  }catch(e){
    if(e?.name!=="AbortError"){console.error(e);alert("Couldn't create the Story image. Try again after the artwork has loaded.");}
  }finally{
    host?.remove();shareBusy=false;btn.disabled=false;btn.textContent="↗ SHARE STORY";
  }
}



let concertsBackendReady=false;
let concertsBackendLoading=null;

function getConcertEntries(){
  try{
    const raw=localStorage.getItem("juggernaut_wrapped_concerts");
    const data=raw?JSON.parse(raw):[];
    return Array.isArray(data)?data:[];
  }catch(e){return []}
}
function saveConcertEntries(entries){
  localStorage.setItem("juggernaut_wrapped_concerts",JSON.stringify(entries));
}
async function concertApi(path, options={}){
  const response=await fetch(path,{
    cache:"no-store",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });
  if(!response.ok){
    let message=`HTTP ${response.status}`;
    try{
      const data=await response.json();
      if(data?.error)message=data.error;
    }catch(e){}
    throw new Error(message);
  }
  return response.status===204?null:response.json();
}
async function syncConcertEntries(){
  if(concertsBackendReady)return getConcertEntries();
  if(concertsBackendLoading)return concertsBackendLoading;

  concertsBackendLoading=(async()=>{
    /* D1 is now the source of truth. Never re-upload stale browser cache. */
    const remote=await concertApi("/concerts");
    saveConcertEntries(Array.isArray(remote)?remote:[]);
    concertsBackendReady=true;
    return getConcertEntries();
  })().catch(error=>{
    concertsBackendReady=false;
    throw error;
  }).finally(()=>{
    concertsBackendLoading=null;
  });

  return concertsBackendLoading;
}

function escapeConcertHtml(value){
  return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function getConcertSort(){
  return localStorage.getItem("juggernaut_wrapped_concert_sort")||"date-desc";
}
function setConcertSort(value){
  localStorage.setItem("juggernaut_wrapped_concert_sort",value);
  activateChapter("concerts",concertsView());

}
function sortedConcertEntries(){
  const entries=[...getConcertEntries()];
  const sort=getConcertSort();
  if(sort==="date-asc") entries.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  else if(sort==="rank") entries.sort((a,b)=>(Number(a.rank)||9999)-(Number(b.rank)||9999));
  else entries.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return entries;
}
function formatConcertDate(date){
  if(!date)return "";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
  return m?`${m[3]}/${m[2]}/${m[1]}`:date;
}
function daysInMonth(year,month){
  return new Date(year,month,0).getDate();
}
function buildDateSelectors(selected){
  const now=new Date();
  let y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();
  if(/^\d{4}-\d{2}-\d{2}$/.test(selected)){
    const p=selected.split("-");
    y=Number(p[0]);m=Number(p[1]);d=Number(p[2]);
  }
  const days=Array.from({length:31},(_,i)=>i+1);
  const months=Array.from({length:12},(_,i)=>i+1);
  const years=Array.from({length:81},(_,i)=>now.getFullYear()-40+i);
  return `<div class="concerts-date-row">
    <select id="concertDay" aria-label="Day">${days.map(n=>`<option value="${n}" ${n===d?"selected":""}>${String(n).padStart(2,"0")}</option>`).join("")}</select>
    <select id="concertMonth" aria-label="Month">${months.map(n=>`<option value="${n}" ${n===m?"selected":""}>${String(n).padStart(2,"0")}</option>`).join("")}</select>
    <select id="concertYear" aria-label="Year">${years.map(n=>`<option value="${n}" ${n===y?"selected":""}>${n}</option>`).join("")}</select>
  </div>
  <div class="concerts-date-caption"><span>DD</span><span>MM</span><span>YYYY</span></div>`;
}

function buildRankPicker(selected){

  const rating=c.rank?`<div class="concert-card-label">PERSONAL RANKING</div><div class="concert-rank">#${escapeConcertHtml(c.rank)}</div>`:"";

  const photo=c.photo?`<img src="${c.photo}" alt="${escapeConcertHtml(c.artist)} concert photo">`:`<div class="concert-card-noimg">NO PHOTO</div>`;
  return `<article class="concert-card concert-chapter">

function getDateValue(){

  const max=daysInMonth(y,m);
  const safe=Math.min(d,max);
  return `${y}-${String(m).padStart(2,"0")}-${String(safe).padStart(2,"0")}`;
}

function removeOpener(button){

async function submitConcert(event){
  event.preventDefault();
  const finish=async(photo)=>{
    const entries=getConcertEntries();
    const id=document.getElementById("concertEditId").value||String(Date.now());
    const existing=entries.find(x=>x.id===id);
    const openers=[...document.querySelectorAll("#openerList .opener-input")].map(x=>x.value.trim()).filter(Boolean);
    const rank=document.querySelector('input[name="concertRank"]:checked')?.value||"";
    const entry={
      id,
      artist:document.getElementById("concertArtist").value.trim(),
      name:document.getElementById("concertName").value.trim(),
      venue:document.getElementById("concertVenue").value.trim(),
      date:getDateValue(),
      city:document.getElementById("concertCity").value.trim(),
      openers,
      setlist:document.getElementById("concertSetlist").value.trim(),
      rank:Number(rank)||null,
      diary:document.getElementById("concertDiary").value.trim(),
      travel:document.getElementById("concertTravel").value.trim(),
      photo:photo||existing?.photo||""
    };
    const isUpdate=Boolean(existing);
    const button=document.getElementById("concertSubmitBtn");
    if(button)button.disabled=true;
    try{
      const saved=await createOrUpdateConcertBackend(entry,isUpdate);
      const idx=entries.findIndex(x=>x.id===id);
      const finalEntry=saved||entry;
      if(idx>=0)entries[idx]=finalEntry;else entries.unshift(finalEntry);
      saveConcertEntries(entries);
      concertsBackendReady=true;
      activateChapter("concerts",concertsView());
      setTab("concerts");
      setTimeout(()=>document.querySelector(".concerts-list")?.scrollIntoView({behavior:"smooth",block:"start"}),50);
    }catch(error){
      console.error("Concert backend save failed:",error);
      saveConcertEntries(isUpdate?entries.map(x=>x.id===id?entry:x):[entry,...entries]);
      alert(`Concert saved locally, but backend sync failed.\n\n${error.message}`);
      activateChapter("concerts",concertsView());
      setTab("concerts");
    }finally{
      if(button)button.disabled=false;
    }
  };
  const file=document.getElementById("concertPhoto").files?.[0];
  if(file){
    const reader=new FileReader();
    reader.onload=()=>finish(reader.result);
    reader.readAsDataURL(file);
  }else await finish("");
}

async function deleteConcert(id){
  const entry=getConcertEntries().find(x=>x.id===id);
  if(!entry)return;
  if(!confirm(`Delete the concert entry for ${entry.artist}?`))return;
  try{
    await deleteConcertBackend(id);
    saveConcertEntries(getConcertEntries().filter(x=>x.id!==id));
    activateChapter("concerts",concertsView());
    setTab("concerts");
  }catch(error){
    console.error("Concert backend delete failed:",error);
    alert(`The concert was not deleted because backend sync failed.\n\n${error.message}`);
  }
}

function exportConcertLog(){
  const entries=getConcertEntries();
  const payload={
    format:"JUGGERNAUT / CONCERT LOG",
    version:1,
    exportedAt:new Date().toISOString(),
    concerts:entries
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url;a.download=`concert-log-${stamp}.json`;a.style.display="none";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

      <div class="concerts-trash-actions"><button class="concert-mini-btn concert-trash-icon-btn" onclick="restoreConcert('${escapeConcertHtml(c.id)}')" aria-label="Restore concert" title="Restore concert">&#x267B;&#xFE0F;</button><button class="concert-mini-btn concert-trash-icon-btn concert-trash-delete-btn" onclick="permanentlyDeleteConcert('${escapeConcertHtml(c.id)}')" aria-label="Permanently delete concert" title="Permanently delete concert">&#x1F5D1;&#xFE0F;&#x274C;</button></div>

function setTab(period){
  document.querySelectorAll(".tabs button").forEach(b=>{
    const active=b.dataset.period===period;
    b.classList.toggle("active",active); b.setAttribute("aria-selected",active);
    if(active){
      const g=document.getElementById("tabGlow");
      g.style.width=`${b.offsetWidth}px`;
      g.style.transform=`translateX(${b.offsetLeft-4}px)`;
      b.scrollIntoView({behavior:"smooth",block:"nearest",inline:"nearest"});
    }
  });
  const share=document.getElementById("shareFab");
  if(share)share.style.display=period==="concerts"?"none":"";
}

function activateChapter(period,content){
  ["day","week","month","year","lifetime","concerts"].forEach(p=>{
    const el=document.getElementById(p);
    const active=p===period;
    el.classList.toggle("active",active);
    if(active && content!==undefined)el.innerHTML=content;
  });
  document.body.classList.toggle("day-mode",period==="day");
  window.scrollTo({top:0,behavior:"auto"});
}

function render(period,d){
  activateChapter(period,period==="day"?dayView(d):longView(d));
  setTab(period);
}

function loadPeriod(period){
  /* The navigation changes FIRST.
     Never leave the previous chapter visible while the new one loads. */
  state.period=period;
  setTab(period);

  if(period==="concerts"){
    activateChapter("concerts",concertsView());
    setTab("concerts");
    syncConcertEntries().then(()=>{
      if(state.period==="concerts"){
        activateChapter("concerts",concertsView());
        setTab("concerts");
      }
    }).catch(error=>{
      console.error("Concert backend load failed:",error);
      if(state.period==="concerts"){
        activateChapter("concerts",concertsView());
        setTab("concerts");
      }
    });
    return;
  }

  const target=document.getElementById(period);

  if(state.cache[period]){
    render(period,state.cache[period]);
    return;
  }

  /* Make the selected chapter visible immediately with its transition screen. */
  activateChapter(period,loadingView(period));

  if(state.requests[period])return;

  getStats(period).then(d=>{
    /* Ignore stale responses if the user has already moved elsewhere. */
    if(state.cache[period]===d && state.period===period){
      render(period,d);
    }
  }).catch(e=>{
    if(state.period!==period)return;
    activateChapter(period,`<main class="story"><div class="story-card" style="display:grid;place-items:center;padding:30px"><strong>Could not load this chapter.</strong><br>${esc(e.message)}</div></main>`);
    setTab(period);
  });
}

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>loadPeriod(b.dataset.period)));
document.getElementById("shareFab").addEventListener("click",shareCurrentStory);
window.addEventListener("resize",()=>setTab(state.period));
loadPeriod("day");
</script>
